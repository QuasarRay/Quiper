[package]
name = "kuiper-vulkan"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[dependencies]
kuiper-contracts = { path = "../../portable/contracts" }
ash = "=0.38.0"
spirv = "=0.3.0"
serde_json = "=1.0.145"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.30.1", features = ["process", "signal", "fs"] }

[[bin]]
name = "kuiper-vulkan-worker"
path = "src/main.rs"
