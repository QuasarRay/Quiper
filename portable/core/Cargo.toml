[package]
name = "kuiper-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[dependencies]
kuiper-contracts = { path = "../contracts" }
serde_json = "=1.0.145"
serde = { version = "=1.0.228", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.30.1", features = ["process", "signal"] }
